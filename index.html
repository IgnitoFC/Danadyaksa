<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danadyaksa — Bimbel Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0F8;--surface:#FFFFFF;--surface2:#F4F6FC;--ink:#141B3A;--muted:#58628A;--line:#DBE0F0;
  --brand:#2B3A9B;--brand-ink:#FFFFFF;--brand-soft:#E3E7FB;--panel:#2B3A9B;
  --gold:#F2B705;--gold-ink:#3A2C00;--gold-soft:#FFF2C7;
  --ok:#12805F;--ok-soft:#DAF3EA;--bad:#C23838;--bad-soft:#FBE2E2;
  --shadow:0 1px 2px rgba(20,27,58,.06),0 8px 24px -12px rgba(20,27,58,.18);
  --fd:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --fb:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1226;--surface:#171C38;--surface2:#1E2446;--ink:#E9ECFA;--muted:#9AA3C7;--line:#2B3260;
    --brand:#8C9BFF;--brand-ink:#0E1226;--brand-soft:#252C5C;--panel:#2B3A9B;
    --gold:#F5C542;--gold-ink:#2E2300;--gold-soft:#3A3213;
    --ok:#4CD1A5;--ok-soft:#123428;--bad:#FF7B7B;--bad-soft:#3A1A1F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1226;--surface:#171C38;--surface2:#1E2446;--ink:#E9ECFA;--muted:#9AA3C7;--line:#2B3260;
  --brand:#8C9BFF;--brand-ink:#0E1226;--brand-soft:#252C5C;--panel:#2B3A9B;
  --gold:#F5C542;--gold-ink:#2E2300;--gold-soft:#3A3213;
  --ok:#4CD1A5;--ok-soft:#123428;--bad:#FF7B7B;--bad-soft:#3A1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:700}h4{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;min-height:42px;transition:background .15s,transform .05s}
.btn:hover{background:var(--surface2)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}.btn.gold:hover{filter:brightness(1.05);background:var(--gold)}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg,.iconbtn svg{width:18px;height:18px;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* form */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:13.5px}
.field small{color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--brand-soft);border-color:var(--brand)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:160px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-weight:600;font-size:13.5px;min-height:20px;margin:-4px 0 10px}

/* kartu */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:var(--surface2);color:var(--muted)}
.chipbtn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;font-weight:600;cursor:pointer;font-size:13.5px}
.chipbtn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty.small{padding:18px;font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--panel);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brandmark{font-family:var(--fd);font-weight:800;font-size:24px;letter-spacing:-.02em;padding:2px 10px 18px;display:flex;align-items:center;gap:10px;color:#fff}
.brandmark i{width:30px;height:30px;border-radius:9px;background:var(--gold);display:grid;place-items:center;color:#3A2C00;font-style:normal;font-size:17px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:rgba(255,255,255,.82);padding:11px 12px;border-radius:10px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button.on{background:#fff;color:#1B2672}
.side .who{margin-top:auto;padding:12px;border-radius:12px;background:rgba(255,255,255,.1);font-size:13.5px}
.side .who b{display:block;font-size:14.5px}
.side .who button{margin-top:10px;width:100%;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:8px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.page{max-width:1080px;margin:0 auto;display:grid;gap:20px}
.ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.ph p{color:var(--muted);margin-top:6px;max-width:60ch}
.tabbar{display:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tile .v{font-family:var(--fd);font-weight:800;font-size:30px;line-height:1.1}
.tile .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.bar{height:9px;border-radius:9px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .3s}
.bar.gold>i{background:var(--gold)}.bar.ok>i{background:var(--ok)}.bar.bad>i{background:var(--bad)}
.brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.brow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brow .p{text-align:right;font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .ln{stroke:var(--brand);fill:none;stroke-width:2.5;stroke-linejoin:round}
.chart .ar{fill:var(--brand);opacity:.12}.chart .dt{fill:var(--surface);stroke:var(--brand);stroke-width:2.2}.chart .tx{fill:var(--muted);font-size:10.5px;font-family:var(--fb)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.heat i.l1{background:var(--brand-soft)}.heat i.l2{background:var(--brand);opacity:.6;border-color:transparent}.heat i.l3{background:var(--brand);border-color:transparent}
.heatl{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}

/* token */
.tokencard{background:var(--panel);color:#fff;border-radius:20px;padding:22px 24px;display:grid;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tokencard::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:var(--gold);opacity:.22}
.tokencard>*{position:relative;z-index:1}
.tk-code{font-family:var(--fd);font-weight:800;font-size:clamp(34px,6vw,52px);letter-spacing:.04em;line-height:1}
.tk-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.tk-bar{height:8px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}
.tk-bar i{display:block;height:100%;background:var(--gold);width:50%}
.tokencard .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:inherit}
.tokencard .btn:hover{background:rgba(255,255,255,.26)}

/* tabel */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-weight:700;color:var(--muted);font-size:13px;background:var(--surface2)}
tr:last-child td{border-bottom:0}
tr.me td{background:var(--gold-soft)}
td .acts{display:flex;gap:6px;justify-content:flex-end}

/* materi */
.mcard{display:grid;gap:10px;align-content:start}
.mcard h3{margin:0}
.prose h4{margin:18px 0 6px;font-size:16px}.prose p{margin:8px 0}.prose ul{margin:8px 0;padding-left:20px}.prose li{margin:4px 0}
.prose code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:.92em}
.prose{max-width:68ch}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.lbrand{background:var(--panel);color:#fff;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.lbrand::before{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;border:44px solid var(--gold);opacity:.25}
.lbrand h1{font-size:clamp(40px,6vw,68px);font-weight:800;letter-spacing:-.03em}
.lbrand p.lead{font-size:18px;max-width:30ch;opacity:.9;margin-top:14px}
.ticket{background:var(--surface);color:var(--ink);border-radius:18px;padding:18px 22px;max-width:360px;position:relative;box-shadow:0 20px 40px -20px rgba(0,0,0,.45)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--panel);transform:translateY(-50%)}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket .code{font-family:var(--fd);font-weight:800;font-size:30px;letter-spacing:.06em;margin:4px 0 10px}
.ticket .cut{border-top:2px dashed var(--line);margin:0 -22px 10px}
.lform{display:grid;place-items:center;padding:28px 20px}
.lbox{width:100%;max-width:400px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:18px 0 22px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.demo{margin-top:18px;font-size:13px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.demo code{background:var(--surface);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}

/* kuis */
.quiz{max-width:760px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:14px}
.qhead{display:flex;align-items:center;gap:12px}
.qtitle{flex:1;display:grid;line-height:1.25}.qtitle span{color:var(--muted);font-size:13px}
.qtimer{font-family:var(--fd);font-weight:800;font-size:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-variant-numeric:tabular-nums}
.qtimer.warn{color:var(--bad);border-color:var(--bad)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.qmeta .iconbtn{margin-left:auto}
.qtext{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:16px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--brand);background:var(--brand-soft)}
.opt b{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}.opt.sel b{background:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong b{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:14.5px}
.exp b{display:block;margin-bottom:3px}
.qnav{display:flex;justify-content:space-between;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:13px}
.dots button.done{background:var(--brand-soft);border-color:var(--brand)}
.dots button.cur{outline:3px solid var(--gold)}
.dots button.fl{box-shadow:inset 0 -4px 0 var(--gold)}
.score{display:grid;place-items:center;text-align:center;padding:10px 0}
.score .big{font-family:var(--fd);font-weight:800;font-size:76px;line-height:1}
.rv{display:grid;gap:14px}
.rv .item{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.rv .item.ok{border-left:5px solid var(--ok)}.rv .item.no{border-left:5px solid var(--bad)}
.rv .opt{padding:8px 12px;cursor:default}
.hint{font-size:13px;color:var(--muted)}
pre.cred{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font-size:13px;white-space:pre;max-height:320px;margin:0 0 12px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(10,14,40,.55)}
.mbox{position:relative;background:var(--surface);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.mbox.wide{max-width:760px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast[hidden]{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-bottom:110px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .tabbar button{display:grid;justify-items:center;gap:2px;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;cursor:pointer;min-width:0}
  .tabbar button.on{color:var(--brand)}
  .tabbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.g21,.g2{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}.lbrand{padding:26px 22px;gap:22px}.lbrand h1{font-size:44px}
  .two{grid-template-columns:1fr}
  .tokencard::after{width:120px;height:120px}
}
@media (max-width:520px){.g3{grid-template-columns:1fr}h1{font-size:26px}.brow{grid-template-columns:90px 1fr 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
/* ============ util ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
const WIB=7*3600e3,DAY=864e5;
const dayKey=(ts=Date.now())=>new Date(ts+WIB).toISOString().slice(0,10);
const fmtD=ts=>new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',timeZone:'Asia/Jakarta'});
const fmtDT=ts=>fmtD(ts)+', '+new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}).replace(':','.');
const dm=ts=>{const d=new Date(ts+WIB);return d.getUTCDate()+'/'+(d.getUTCMonth()+1);};
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const shortName=n=>{const p=String(n).trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0]+'.':p[0];};
const ago=ts=>{if(!ts)return'Belum pernah';const d=Math.round((new Date(dayKey()).getTime()-new Date(dayKey(ts)).getTime())/DAY);return d<=0?'Hari ini':d===1?'Kemarin':d+' hari lalu';};
function h53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
const hp=p=>h53(String(p)+'|danadyaksa').toString(36);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function seedHasil(db,u,sd,base,n){
  const r=rng(sd),now=Date.now();
  for(let i=0;i<n;i++){
    const p=db.paket[Math.floor(r()*db.paket.length)],pa=Math.min(.95,base+i*.025);
    const items=p.soal.map(s=>{const ok=r()<pa;return {q:s.q,opts:s.opts,ans:s.ans,exp:s.exp,topik:s.topik,mapel:p.mapel,level:s.level,pick:ok?s.ans:(s.ans+1+Math.floor(r()*3))%4};});
    const benar=items.filter(x=>x.pick===x.ans).length,daysAgo=n>1?Math.round((n-1-i)*13/(n-1)):0;
    db.hasil.push({id:uid(),uid:u,paketId:p.id,judul:p.judul,mapel:p.mapel,mode:r()<.5?'latihan':'ujian',tgl:now-daysAgo*DAY-Math.floor(r()*5)*36e5,durasi:120+Math.floor(r()*300),benar,total:items.length,skor:Math.round(benar/items.length*100),items});
  }
}

function tokenFor(day=dayKey()){
  let n=h53(day+'|'+DB.settings.salt+'|'+((DB.settings.bump||{})[day]||0)),s='';
  for(let i=0;i<6;i++){s+=ALPHA[n%32];n=Math.floor(n/32);}
  return s;
}
const tokenFmt=()=>{const t=tokenFor();return 'DND-'+t.slice(0,3)+'-'+t.slice(3);};
const normTok=t=>{t=String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return t.startsWith('DND')?t.slice(3):t;};
function msToMidnight(){const now=Date.now();return (Math.floor((now+WIB)/DAY)+1)*DAY-WIB-now;}

const ures=id=>DB.hasil.filter(r=>r.uid===id).sort((a,b)=>a.tgl-b.tgl);

function lvl(xp){const l=Math.floor(Math.sqrt(xp/60))+1,lo=60*(l-1)**2,hi=60*l*l;return {l,pct:Math.round((xp-lo)/(hi-lo)*100),next:hi-xp};}
function streak(id){const days=new Set(ures(id).map(r=>dayKey(r.tgl)));let n=0,t=Date.now();if(!days.has(dayKey(t)))t-=DAY;while(days.has(dayKey(t))){n++;t-=DAY;}return n;}
function groupStats(rs,keyFn){const m={};for(const r of rs)for(const it of r.items){const k=keyFn(it),o=m[k]||(m[k]={k,mapel:it.mapel,topik:it.topik,b:0,t:0});o.t++;if(it.pick===it.ans)o.b++;}return Object.values(m).map(o=>Object.assign(o,{acc:o.b/o.t}));}
const topicStats=rs=>groupStats(rs,i=>i.mapel+'|'+i.topik);
const mapelStats=rs=>groupStats(rs,i=>i.mapel);
function summary(id){const rs=ures(id),t=rs.reduce((s,r)=>s+r.total,0),b=rs.reduce((s,r)=>s+r.benar,0);return {n:rs.length,soal:t,benar:b,acc:t?b/t*100:0,skor:avg(rs.map(r=>r.skor)),last:Math.max(0,...rs.map(r=>r.tgl),(DB.users.find(u=>u.id===id)||{}).last||0)};}

function md(t){
  const lines=esc(t).split('\n');let out='',ul=false;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  for(const ln of lines){
    if(/^- /.test(ln)){if(!ul){out+='<ul>';ul=true;}out+='<li>'+inl(ln.slice(2))+'</li>';continue;}
    if(ul){out+='</ul>';ul=false;}
    if(/^## /.test(ln))out+='<h4>'+inl(ln.slice(3))+'</h4>';else if(ln.trim())out+='<p>'+inl(ln)+'</p>';
  }
  return out+(ul?'</ul>':'');
}

function pDasbor(){
  const ss=siswa(),today=dayKey(),active=ss.filter(s=>(s.last&&dayKey(s.last)===today)||DB.hasil.some(r=>r.uid===s.id&&dayKey(r.tgl)===today)).length;
  const all=DB.hasil,nSoal=DB.paket.reduce((a,p)=>a+p.soal.length,0),week=Date.now()-7*DAY;
  const days=Array.from({length:7},(_,i)=>{const t=Date.now()-(6-i)*DAY,k=dayKey(t);return {l:dm(t),v:all.filter(r=>dayKey(r.tgl)===k).length};});
  const mx=Math.max(...days.map(d=>d.v),1);
  const hard=topicStats(all).filter(t=>t.t>=3).sort((a,b)=>a.acc-b.acc).slice(0,5).map(t=>({label:t.topik+' ('+t.mapel+')',v:t.acc*100}));
  const top=ss.map(s=>({s,xp:xpOf(s.id,week)})).sort((a,b)=>b.xp-a.xp).slice(0,5);
  return '<div class="page"><div class="ph"><div><h1>Dasbor admin</h1><p>Ringkasan aktivitas belajar di Danadyaksa.</p></div></div>'+tokenCard()+
   '<div class="grid g4"><div class="tile"><div class="v">'+ss.length+'</div><div class="l">Akun pelajar</div></div><div class="tile"><div class="v">'+active+'</div><div class="l">Aktif hari ini</div></div><div class="tile"><div class="v">'+DB.materi.length+'</div><div class="l">Materi tersedia</div></div><div class="tile"><div class="v">'+nSoal+'</div><div class="l">Soal di '+DB.paket.length+' paket</div></div></div>'+
   '<div class="grid g2"><div class="card"><h3>Drilling selesai, 7 hari terakhir</h3><div style="display:flex;gap:10px;align-items:flex-end;height:150px">'+days.map(d=>'<div style="flex:1;display:grid;gap:6px;justify-items:center;align-content:end;height:100%"><span style="font-weight:700;font-size:13px">'+d.v+'</span><div style="width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--brand);height:'+Math.max(4,d.v/mx*100)+'px;opacity:'+(d.v?1:.25)+'"></div><span class="hint">'+esc(d.l)+'</span></div>').join('')+'</div></div>'+
   '<div class="card"><h3>Topik yang paling sulit bagi pelajar</h3>'+barRows(hard)+'<p class="hint" style="margin-top:8px">Dihitung dari topik dengan minimal 3 soal terjawab.</p></div></div>'+
   '<div class="card"><h3>Pelajar paling rajin minggu ini</h3>'+(top.length?'<div class="tw" style="border:0"><table><tbody>'+top.map((t,i)=>'<tr><td style="width:40px;font-weight:800">'+(i+1)+'</td><td><b>'+esc(t.s.nama)+'</b><div class="hint">'+esc(t.s.kelas)+'</div></td><td style="text-align:right"><span class="chip gold">'+t.xp+' XP</span></td></tr>').join('')+'</tbody></table></div>':'<div class="empty small">Belum ada pelajar.</div>')+'</div></div>';
}

function pBeranda(u){
  const rs=ures(u.id),sm=summary(u.id),xp=xpOf(u.id),L=lvl(xp),st=streak(u.id),todayN=rs.filter(r=>dayKey(r.tgl)===dayKey()).reduce((a,r)=>a+r.total,0);
  const trend=rs.slice(-10).map(r=>({v:r.skor,l:dm(r.tgl)}));
  const ms=mapelStats(rs).sort((a,b)=>b.acc-a.acc).map(m=>({label:m.mapel,v:m.acc*100}));
  const weak=topicStats(rs).filter(t=>t.t>=2).sort((a,b)=>a.acc-b.acc).slice(0,3);
  const week=Date.now()-7*DAY,board=siswa().map(s=>({s,xp:xpOf(s.id,week)})).sort((a,b)=>b.xp-a.xp),myRank=board.findIndex(b=>b.s.id===u.id)+1;
  const shown=board.slice(0,5);if(myRank>5)shown.push(board[myRank-1]);
  return '<div class="page"><div class="ph"><div><h1>Halo, '+esc(u.nama.split(' ')[0])+'</h1><p>'+(todayN>=20?'Target hari ini sudah tercapai. Mantap!':'Selesaikan '+(20-todayN)+' soal lagi untuk mencapai target hari ini.')+'</p></div><button class="btn gold" data-act="smartDrill">'+ic('bolt')+'Drilling cerdas</button></div>'+
   '<div class="grid g3"><div class="tile"><div class="row" style="justify-content:space-between"><span class="l" style="margin:0">Level</span><span class="chip gold">'+xp+' XP</span></div><div class="v">'+L.l+'</div><div class="bar gold" style="margin:10px 0 6px"><i style="width:'+L.pct+'%"></i></div><div class="hint">'+L.next+' XP lagi ke level '+(L.l+1)+'</div></div>'+
   '<div class="tile"><div class="row" style="justify-content:space-between"><span class="l" style="margin:0">Runtutan belajar</span><span style="color:var(--gold)">'+ic('flame')+'</span></div><div class="v">'+st+' hari</div><div class="hint" style="margin-top:10px">'+(st?'Jaga terus, jangan putus hari ini.':'Mulai satu drilling untuk memulai runtutan.')+'</div></div>'+
   '<div class="tile"><span class="l" style="margin:0">Target hari ini</span><div class="v">'+Math.min(todayN,20)+'<span class="muted" style="font-size:18px"> / 20 soal</span></div><div class="bar ok" style="margin-top:12px"><i style="width:'+Math.min(100,todayN/20*100)+'%"></i></div></div></div>'+
   '<div class="grid g4"><div class="tile"><div class="v">'+(sm.n?Math.round(sm.skor):'-')+'</div><div class="l">Rata-rata skor</div></div><div class="tile"><div class="v">'+(sm.n?Math.round(sm.acc)+'%':'-')+'</div><div class="l">Akurasi jawaban</div></div><div class="tile"><div class="v">'+sm.soal+'</div><div class="l">Soal dikerjakan</div></div><div class="tile"><div class="v">'+Object.keys(DB.baca[u.id]||{}).length+'<span class="muted" style="font-size:18px">/'+DB.materi.length+'</span></div><div class="l">Materi selesai dibaca</div></div></div>'+
   '<div class="grid g21"><div class="card"><h3>Tren skor 10 drilling terakhir</h3>'+lineChart(trend)+'</div><div class="card"><h3>Aktivitas</h3>'+heat(actCounts(rs,14))+'</div></div>'+
   '<div class="grid g2"><div class="card"><h3>Akurasi per mata pelajaran</h3>'+barRows(ms)+'</div><div class="card"><h3>Topik yang perlu diperkuat</h3>'+(weak.length?weak.map(t=>'<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(t.topik)+'</b><div class="hint">'+esc(t.mapel)+', akurasi '+Math.round(t.acc*100)+'%</div></div><button class="btn sm" data-act="topicDrill" data-m="'+esc(t.mapel)+'" data-t="'+esc(t.topik)+'">Latih</button></div>').join(''):'<div class="empty small">Kerjakan beberapa drilling dulu. Kelemahanmu akan terdeteksi otomatis.</div>')+'</div></div>'+
   '<div class="card"><h3>'+ic('trophy')+' Papan peringkat 7 hari terakhir</h3><div class="tw" style="border:0"><table><tbody>'+shown.map(b=>'<tr class="'+(b.s.id===u.id?'me':'')+'"><td style="width:44px;font-weight:800">'+(board.indexOf(b)+1)+'</td><td>'+esc(b.s.id===u.id?'Kamu':shortName(b.s.nama))+'</td><td>'+esc(b.s.kelas)+'</td><td style="text-align:right"><b>'+b.xp+' XP</b></td></tr>').join('')+'</tbody></table></div></div></div>';
}

function snap(s,mapel){return {q:s.q,opts:s.opts,ans:s.ans,exp:s.exp,topik:s.topik,level:s.level,mapel:s.mapel||mapel};}
function startQuiz(qs,meta){

  Q=Object.assign({qs,i:0,picks:qs.map(()=>null),flags:{},start:Date.now(),back:S.route},meta);

  Q.timer=setInterval(()=>{if(!Q)return;const el=$('#qtimer');const el_s=(Date.now()-Q.start)/1000;if(Q.limit&&el_s>=Q.limit){finishQuiz();toast('Waktu habis, jawabanmu otomatis dikirim.');return;}if(el){el.textContent=mmss(Q.limit?Q.limit-el_s:el_s);el.classList.toggle('warn',!!Q.limit&&Q.limit-el_s<60);}},500);
}
function quizView(){
  const q=Q.qs[Q.i],pick=Q.picks[Q.i],lat=Q.mode==='latihan',locked=lat&&pick!==null,done=Q.picks.filter(x=>x!==null).length,last=Q.i===Q.qs.length-1;
  return '<div class="quiz"><header class="qhead"><button class="btn ghost sm" data-act="qexit">Keluar</button><div class="qtitle"><b>'+esc(Q.judul)+'</b><span>'+(lat?'Mode latihan':'Mode ujian')+', '+done+' dari '+Q.qs.length+' terjawab</span></div><div class="qtimer" id="qtimer">'+mmss(0)+'</div></header>'+

   '<p class="qtext">'+esc(q.q)+'</p><div class="opts">'+q.opts.map((o,k)=>'<button class="opt'+(locked?(k===q.ans?' right':pick===k?' wrong':''):(pick===k?' sel':''))+'" data-act="qpick" data-k="'+k+'"'+(locked?' disabled':'')+'><b>'+'ABCD'[k]+'</b><span>'+esc(o)+'</span></button>').join('')+'</div>'+
   (locked?'<div class="exp"><b>'+(pick===q.ans?'Benar!':'Belum tepat. Jawaban yang benar: '+'ABCD'[q.ans])+'</b>'+esc(q.exp||'Belum ada pembahasan untuk soal ini.')+'</div>':'')+'</section>'+
   '<div class="qnav"><button class="btn" data-act="qgo" data-i="'+(Q.i-1)+'"'+(Q.i===0?' disabled':'')+'>Sebelumnya</button>'+(last?'<button class="btn gold" data-act="qfinish">Selesai dan kirim</button>':'<button class="btn primary" data-act="qgo" data-i="'+(Q.i+1)+'">Berikutnya</button>')+'</div>'+
   '<div class="dots" aria-label="Navigasi soal">'+Q.qs.map((_,i)=>'<button class="'+(Q.picks[i]!==null?'done ':'')+(i===Q.i?'cur ':'')+(Q.flags[i]?'fl':'')+'" data-act="qgo" data-i="'+i+'" aria-label="Soal '+(i+1)+'">'+(i+1)+'</button>').join('')+'</div></div>';
}
function finishQuiz(){
  clearInterval(Q.timer);const u=me();
  const items=Q.qs.map((s,k)=>Object.assign(snap(s,Q.mapel),{pick:Q.picks[k]})),benar=items.filter(i=>i.pick===i.ans).length;
  const r={id:uid(),uid:u.id,paketId:Q.paketId||null,judul:Q.judul,mapel:Q.mapel,mode:Q.mode,tgl:Date.now(),durasi:Math.round((Date.now()-Q.start)/1000),benar,total:items.length,skor:Math.round(benar/items.length*100),items};
  DB.hasil.push(r);save();S.back=Q.back;Q=null;S.route='hasil';S.params={id:r.id};render();window.scrollTo(0,0);
}
function pool(filterFn){const out=[];DB.paket.forEach(p=>p.soal.forEach(s=>{if(filterFn(p,s))out.push(Object.assign({},s,{mapel:p.mapel}));}));return out;}
function smartPick(n,uidv,prefM,prefT){
  const acc={};topicStats(ures(uidv)).forEach(t=>{acc[t.k]=t.acc;});
  let all=pool(()=>true).map(q=>{const k=q.mapel+'|'+q.topik,a=k in acc?acc[k]:.5;return {w:1.2-a,q};});
  const out=[];
  if(prefT){all.filter(x=>x.q.mapel===prefM&&x.q.topik===prefT).forEach(x=>{if(out.length<n)out.push(x.q);});all=all.filter(x=>!out.includes(x.q));}
  while(out.length<n&&all.length){const tot=all.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,i=0;for(;i<all.length;i++){r-=all[i].w;if(r<=0)break;}i=Math.min(i,all.length-1);out.push(all[i].q);all.splice(i,1);}
  return out;
}

 qgo(el){const i=+el.dataset.i;if(i>=0&&i<Q.qs.length){Q.i=i;qr();window.scrollTo(0,0);}},
 qflag(){Q.flags[Q.i]=!Q.flags[Q.i];qr();},
 qfinish(){const left=Q.picks.filter(x=>x===null).length;if(left){confirmBox(left+' soal belum dijawab. Tetap kirim sekarang?','Kirim',finishQuiz);}else finishQuiz();},
 qexit(){confirmBox('Keluar dari sesi ini? Jawabanmu tidak akan disimpan.','Keluar',()=>{clearInterval(Q.timer);const b=Q.back;Q=null;S.route=b||'drilling';render();});},
 openHasil(el){S.back=S.route;go('hasil',{id:el.dataset.id});},
 exportData(){saveFile('danadyaksa-cadangan-'+dayKey()+'.json',JSON.stringify(DB));},
 resetDemo(){confirmBox('Semua data (akun, materi, soal, riwayat) akan diganti dengan data demo bawaan.','Kembalikan',()=>{DB=seed();save();session={uid:'u_admin',day:dayKey()};saveSession();go('setelan');toast('Data demo dipulihkan');});}
};
function qr(){const y=window.scrollY;app.innerHTML=quizView();window.scrollTo(0,y);}
const genPass=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s;};
function genUser(nama){let b=nama.toLowerCase().split(/\s+/)[0].replace(/[^a-z0-9]/g,'')||'siswa',u=b,i=1;while(DB.users.some(x=>x.username===u))u=b+(++i);return u;}
function showCreds(list,title){
  const txt=list.map(c=>c.n+'\nUsername: '+c.u+'\nKata sandi: '+c.p).join('\n\n');
  modal(mh(title||'Akun berhasil dibuat')+'<p class="hint" style="margin-bottom:10px">Catat atau salin sekarang. Kata sandi tidak akan ditampilkan lagi.</p><pre class="cred">'+esc(txt)+'</pre><div class="row" style="justify-content:flex-end"><button class="btn" data-act="copyCreds">'+ic('copy')+'Salin semua</button><button class="btn primary" data-act="closeModal">Selesai</button></div>');
  A.copyCreds=()=>copy(txt);render();
}
const F={
 login(f){
  const d=new FormData(f),role=d.get('role'),un=String(d.get('u')).trim().toLowerCase(),err=m=>{$('#lerr').textContent=m;};
  const u=DB.users.find(x=>x.username===un&&x.role===role);
  if(!u||u.pass!==hp(d.get('p')))return err('Username atau kata sandi tidak cocok.');
  if(role==='siswa'&&DB.settings.tokenRequired&&normTok(d.get('t'))!==tokenFor())return err('Token salah atau sudah berganti. Minta token terbaru ke admin.');
  session={uid:u.id,day:dayKey()};saveSession();u.last=Date.now();save();S.route=role==='admin'?'dasbor':'beranda';S.last='';render();
 },
 addSiswa(f){
  const d=new FormData(f),nama=String(d.get('nama')).trim(),un=String(d.get('un')).trim().toLowerCase()||genUser(nama),pw=String(d.get('pw')).trim()||genPass();
  if(DB.users.some(x=>x.username===un)){$('#merr').textContent='Username “'+un+'” sudah dipakai. Pilih yang lain.';return;}
  if(pw.length<6){$('#merr').textContent='Kata sandi minimal 6 karakter.';return;}
  DB.users.push({id:uid(),nama,username:un,pass:hp(pw),role:'siswa',kelas:String(d.get('kelas')).trim(),tgl:Date.now()});save();showCreds([{n:nama,u:un,p:pw}]);
 },
 bulkSiswa(f){
  const lines=String(new FormData(f).get('txt')).split('\n').map(s=>s.trim()).filter(Boolean),out=[];
  lines.forEach(l=>{const p=l.split(',').map(s=>s.trim()),nama=p[0];if(!nama)return;const un=genUser(nama),pw=genPass();DB.users.push({id:uid(),nama,username:un,pass:hp(pw),role:'siswa',kelas:p[1]||'',tgl:Date.now()});out.push({n:nama,u:un,p:pw});});
  save();if(out.length)showCreds(out,out.length+' akun berhasil dibuat');else toast('Tidak ada baris yang valid.');
 },
 saveMateri(f){
  const d=Object.fromEntries(new FormData(f)),v=String(d.video||'').trim();
  if(v&&!/^https?:\/\//i.test(v)){toast('Tautan video harus diawali http:// atau https://');return;}
  const o={mapel:d.mapel,bab:d.bab.trim(),judul:d.judul.trim(),isi:d.isi,video:v},ex=DB.materi.find(m=>m.id===d.id);
  if(ex)Object.assign(ex,o);else DB.materi.push(Object.assign({id:uid(),tgl:Date.now()},o));
  save();closeModal();render();toast('Materi disimpan');
 },
 savePaket(f){
  const d=Object.fromEntries(new FormData(f)),o={judul:d.judul.trim(),mapel:d.mapel,durasi:Math.max(0,+d.durasi||0)},ex=DB.paket.find(p=>p.id===d.id);
  if(ex)Object.assign(ex,o);else{const p=Object.assign({id:uid(),soal:[],tgl:Date.now()},o);DB.paket.push(p);save();closeModal();go('paket',{id:p.id});toast('Paket dibuat. Sekarang tambahkan soal.');return;}
  save();closeModal();render();toast('Paket disimpan');
 },
 saveSoal(f){
  const d=Object.fromEntries(new FormData(f)),p=DB.paket.find(x=>x.id===d.pid);
  if(d.ans==null){toast('Pilih jawaban yang benar dulu.');return;}
  const o={q:d.q.trim(),opts:[d.o0,d.o1,d.o2,d.o3].map(s=>s.trim()),ans:+d.ans,exp:d.exp.trim(),topik:d.topik.trim(),level:d.level},ex=p.soal.find(s=>s.id===d.id);
  if(ex)Object.assign(ex,o);else p.soal.push(Object.assign({id:uid()},o));
  save();closeModal();render();toast('Soal disimpan');
 },
 bulkSoal(f){
  const d=Object.fromEntries(new FormData(f)),p=DB.paket.find(x=>x.id===d.pid),res=parseBulk(d.txt);
  if(res.errs.length){$('#merr').textContent=res.errs.slice(0,3).join(' ');return;}
  if(!res.out.length){$('#merr').textContent='Tidak ada soal yang terbaca.';return;}
  res.out.forEach(s=>p.soal.push(s));save();closeModal();render();toast(res.out.length+' soal berhasil diimpor');
 },
 addMapel(f){const m=String(new FormData(f).get('m')).trim();if(m&&!DB.settings.mapel.includes(m)){DB.settings.mapel.push(m);save();render();toast('Mapel ditambahkan');}},
 passwd(f){
  const d=new FormData(f),u=me(),e=$('#perr');
  if(u.pass!==hp(d.get('old')))return void(e.textContent='Kata sandi lama tidak cocok.');
  if(String(d.get('nw')).length<6)return void(e.textContent='Kata sandi baru minimal 6 karakter.');
  u.pass=hp(d.get('nw'));save();f.reset();e.textContent='';toast('Kata sandi diperbarui');
 }
};
function parseBulk(txt){
  const blocks=String(txt).replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean),out=[],errs=[];
  blocks.forEach((b,bi)=>{
    const q=[],opts=[];let ans=null,exp='',topik='Umum',level='Sedang',m;
    for(const ln of b.split('\n')){
      if((m=ln.match(/^\s*([A-D])[\).]\s*(.+)$/i)))opts[m[1].toUpperCase().charCodeAt(0)-65]=m[2].trim();
      else if((m=ln.match(/^\s*jawaban\s*[:=]\s*([A-D])/i)))ans=m[1].toUpperCase().charCodeAt(0)-65;
      else if((m=ln.match(/^\s*pembahasan\s*[:=]\s*(.+)$/i)))exp=m[1].trim();
      else if((m=ln.match(/^\s*topik\s*[:=]\s*(.+)$/i)))topik=m[1].trim();
      else if((m=ln.match(/^\s*(?:level|tingkat)\s*[:=]\s*(mudah|sedang|sulit)/i)))level=cap(m[1]);
      else if(!opts.length)q.push(ln.trim());
    }
    const qt=q.join(' ').trim();
    if(!qt||[0,1,2,3].some(i=>!opts[i])||ans===null)errs.push('Soal ke-'+(bi+1)+' belum lengkap (butuh pertanyaan, opsi A sampai D, dan baris Jawaban).');
    else out.push({id:uid(),q:qt,opts:opts.slice(0,4),ans,exp,topik,level});
  });
  return {out,errs};
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.type!=='checkbox')e.preventDefault();f(el,e);});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const h=F[f.dataset.form];if(h)h(f);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='impfile'){
    const file=e.target.files[0];if(!file)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.users)||!d.settings||!Array.isArray(d.paket))throw 0;DB=d;save();if(!me()){session=null;saveSession();}render();toast('Cadangan berhasil diimpor');}catch(x){toast('File cadangan tidak valid.');}};
    r.readAsText(file);
  }
});
if(session&&me()&&me().role==='siswa'&&DB.settings.tokenRequired&&session.day!==dayKey()){session=null;saveSession();}
render();
})();
</script>
